<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Upload - {{ contratado.nome }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topo">📋 Sistema RH — Documentos</div>
    <div class="container">
    <h1>Olá {{ contratado.nome }}</h1>
    <p>Envie seus documentos abaixo para dar continuidade à sua admissão.</p>

    <form method="POST" enctype="multipart/form-data">
        <label>Tipo de documento:</label>
        <select name="tipo_documento">
            {% for tipo in tipos %}
                <option value="{{ tipo }}">{{ tipo }}</option>
            {% endfor %}
        </select>
        <label>Arquivo:</label>
        <input type="file" name="documento">

        <button type="submit"> Enviar</button>
    </form>
    </div>
</body>
</html>
