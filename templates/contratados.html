<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topo">📋 Sistema RH — Documentos</div>
    <div class="container">
    <h1>Contratados</h1>
    <p class="subtitulo">Acompanhe quem já enviou os documentos</p>

  <ul style="list-style: none; padding: 0;">
    {% for pessoa in contratados %}
    <li style="padding: 12px 0; border-bottom: 1px solid var(--cinza-medio);">
        <a href="{{ url_for('detalhes_contratado', id_contratado=pessoa.id) }}" style="text-decoration: none; color: var(--cor-texto);">
            <strong>{{ pessoa.nome}}</strong> - {{ pessoa.email }}
            <br>
            <span class="badge">{{ pessoa.documentos|length }} documento(s) enviado(s)</span>
        </a>
    </li>
    {% endfor %}
  </ul>
   </div>
</body>
</html>
