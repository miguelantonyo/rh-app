<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topo">📋 Sistema RH — Documentos</div>
    <div class="container">
        <h1>Login</h1>
        <p class="subtitulo">Acesse o painel para gerenciar os contratados</p>

        <form method="POST">
            <label>Email:</label>
            <input type="email" name="email">

            <label>Senha:</label>
            <input type="password" name="senha">

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
